<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRUD Pets</title>

    <link rel="stylesheet" href="style.css">

</head>

<body data-page="home">

    <header class="topo">

        <div>
            <h1>Gerenciador De PetShop</h1>
            <p class="subtitulo">
                Sistema de gerenciamento de pets
            </p>
        </div>

        <div class="topo-actions">
            <a class="page-link" href="dashboard.html">Dashboard</a>
            <a class="page-link" href="meus-pets.html">Meus Pets</a>
        </div>

    </header>

    <!-- FEEDBACK -->

    <div
        id="feedback"
        aria-live="polite"
        style="min-height:1.5em;"
    ></div>

    <!-- FORMULÁRIO -->

    <form autocomplete="off">

        <label for="NomeDono">
            Nome do Dono
        </label>

        <input
            type="text"
            id="NomeDono"
            name="NomeDono"
            placeholder="Digite o nome do dono"
            autocomplete="off"
        >

        <label for="NomePet">
            Nome do Pet
        </label>

        <input
            type="text"
            id="NomePet"
            name="NomePet"
            placeholder="Digite o nome do pet"
            autocomplete="off"
        >

        <label for="RacaPet">
            Raça do Pet
        </label>

        <input
            type="text"
            id="RacaPet"
            name="RacaPet"
            placeholder="Digite a raça"
            autocomplete="off"
        >

        <label for="IdadePet">
            Idade do Pet
        </label>

        <input
            type="number"
            id="IdadePet"
            name="IdadePet"
            placeholder="Digite a idade"
            autocomplete="off"
        >

        <label for="EspeciePet">
            Espécie do Pet
        </label>

        <select
            id="EspeciePet"
            name="EspeciePet"
            required
        >
            <option value="">Selecione a espécie</option>
            <option value="Cão">Cão</option>
            <option value="Gato">Gato</option>
            <option value="Outros">Outros</option>
        </select>

        <label for="PesoPet">
            Peso do Pet
        </label>

        <input
            type="number"
            id="PesoPet"
            name="PesoPet"
            placeholder="Digite o peso"
            step="0.1"
            autocomplete="off"
        >

        <label for="ObservacoesPet">
            Observações
        </label>

        <textarea
            id="ObservacoesPet"
            name="ObservacoesPet"
            placeholder="Digite observações sobre o pet"
            rows="4"
        ></textarea>

        <label for="FotoPet">
            Foto do Pet
        </label>

        <input
            type="file"
            id="FotoPet"
            name="FotoPet"
            accept="image/*"
        >

        <input
            type="submit"
            value="Cadastrar"
        >

    </form>

    <!-- TABELA -->


<table>

    <thead>

        <tr>

            <th>Nome do Dono</th>

            <th>Nome do Pet</th>

            <th>Raça</th>

            <th>Idade</th>

            <th>Espécie</th>

            <th>Peso</th>

            <th>Observações</th>

            <th>Ações</th>

        </tr>

    </thead>

    <tbody id="tabela-pets"></tbody>

</table>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>

</html>
